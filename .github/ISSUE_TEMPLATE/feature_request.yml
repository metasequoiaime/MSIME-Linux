name: 功能建议 / Feature request
description: 希望增加功能或改善体验？说说你的使用场景。Suggest a feature or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本仓库只负责 Linux／IBus 适配层、安装、打包与 CI。涉及组词逻辑或词库的建议请提到 [MSIME-Engine](https://github.com/metasequoiaime/MSIME-Engine)。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 说说你在什么情况下遇到不便，以及它对你的影响。不需要了解技术实现。Describe your situation and the difficulty.
      placeholder: 例如：在高分辨率屏幕上打字时，候选字太小，看清后才能选字，打字容易中断。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为 / Desired behaviour
      description: 描述你希望达到的效果即可，不用设计实现方案。还没想好可以跳过。Describe the result you would like; an implementation plan is not needed.
      placeholder: 例如：希望能在设置里调大候选字，并立即看到调整效果。
    validations:
      required: false
  - type: input
    id: parity
    attributes:
      label: 其他平台的对应实现 / Behaviour on other platforms
      description: 如果 Windows 或 macOS 版已有这项能力，请说明它在那边的行为，便于保持一致。
  - type: checkboxes
    id: network
    attributes:
      label: 联网 / Network access
      options:
        - label: 这项能力需要访问网络（会涉及隐私说明与默认开关）
