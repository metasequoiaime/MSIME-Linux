name: 缺陷报告 / Bug report
description: 遇到出错、无法输入或显示异常？请描述现象，我们一起排查。Report something that is not working.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        疑似安全漏洞请不要在这里提交，按 [SECURITY.md](https://github.com/metasequoiaime/.github/blob/main/SECURITY.md) 私下上报。

        组词结果本身的问题（选字顺序、词库缺词）属于 [MSIME-Engine](https://github.com/metasequoiaime/MSIME-Engine)，请提到对应仓库。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述 / What happened
      description: 实际发生了什么，你期望发生什么。
      placeholder: 例如：打开记事本，切换到水杉输入法后，候选字显示成方框，无法辨认。其他软件中也会出现。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 按顺序写下你做了什么。偶尔出现、无法稳定重现也可以反馈，请写出当时的操作。Describe what you did, even if the issue only happens sometimes.
      placeholder: |-
        1. 打开文本编辑器，切换到水杉输入法的全拼方案
        2. 输入测试拼音 nihao
        3. 观察候选字是否正常显示
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: 填写你安装的输入法版本号，可查看安装包文件名或下载记录。暂时找不到请填“不确定”。Use the installed version; enter Not sure if unavailable.
      placeholder: 例如：安装包中的 vX.Y.Z；不知道请填“不确定”
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 发行版与版本、桌面环境、X11 还是 Wayland、IBus 版本。 知道多少写多少，不清楚的项目可写“不确定”。Include what you know; unknown details are OK.
      placeholder: Ubuntu 24.04, GNOME 46, Wayland, ibus 1.5.29
    validations:
      required: true
  - type: dropdown
    id: scheme
    attributes:
      label: 输入方案 / Input scheme
      options:
        - 全拼
        - 双拼
        - 五笔
        - 日语罗马音
        - 与方案无关
        - 不确定 / Not sure
      description: 选择当时使用的输入方式；不知道名称可以选“不确定”。Choose your input method, or Not sure.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: 相关设置 / Relevant settings
      description: "`config.ini` 中的相关片段。请先删除任何端点地址之外的敏感信息；令牌存放在 Secret Service 中，不应出现在这个文件里。"
      render: ini
  - type: textarea
    id: logs
    attributes:
      label: 日志或输出 / Logs
      description: 相关的终端输出，例如手动运行 `metasequoia-ime-ibus` 或 `metasequoia-ime-voice` 时的信息。
      render: shell
