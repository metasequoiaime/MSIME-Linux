name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request from a branch in this repository used to build twice, once for
# the push and once for the pull request. Keep one run per ref and drop the
# superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    # Both architectures are covered because the published packages target both,
    # and GitHub's arm64 runners are free for public repositories, so the second
    # job runs in parallel and costs no extra wall-clock time.
    name: Ubuntu IBus (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      # Cheap and runs before the build so a formatting slip fails in seconds
      # rather than after the full compile. Formatting is architecture
      # independent, so only one job needs to check it.
      - name: Check formatting
        if: ${{ matrix.arch == 'amd64' }}
        run: scripts/format.sh --check
      - name: Bootstrap and test dependencies
        run: tests/CiDependenciesTests.sh "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config libibus-1.0-dev libboost-dev libboost-json-dev libcurl4-openssl-dev libfmt-dev libspdlog-dev libsqlite3-dev libsecret-1-dev libgtk-3-dev tesseract-ocr tesseract-ocr-chi-sim gnome-keyring python3 python3-gi python3-pypinyin gir1.2-ibus-1.0 ibus dbus-x11 iso-codes
      - name: Build dictionary
        run: python3 scripts/build_dictionary.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 20 -E '^ibus_smoke$'
      - name: IBus D-Bus smoke
        run: ctest --test-dir build --output-on-failure --timeout 20 -R '^ibus_smoke$'
      - name: Current-user install smoke
        shell: bash
        run: tests/InstallSmoke.sh build
      # Release assets from both architectures land in the same place, so a name
      # that omits the architecture silently overwrites the other build. This is
      # cheap here and catches it before a release rather than during one.
      # The install smoke above reconfigures this build directory with its own
      # throwaway prefix, so packaging has to reconfigure with the prefix the
      # packages install into before it can check anything meaningful.
      - name: Verify packaged names and component path
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr
          rm -rf build/nametest build/debcheck
          cpack --config build/CPackConfig.cmake -G "TGZ;DEB" -B build/nametest
          machine=$(uname -m)
          shopt -s nullglob
          archives=(build/nametest/*.tar.gz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one archive, found: ${archives[*]}" >&2
            exit 1
          fi
          echo "archive: ${archives[0]}"
          if [[ "${archives[0]}" != *"$machine"* ]]; then
            echo "Archive name does not carry the architecture $machine: ${archives[0]}" >&2
            exit 1
          fi
          # The IBus component's exec path must name a file the package ships,
          # or the engine registers but can never be activated.
          mkdir -p build/debcheck
          dpkg-deb -x build/nametest/*.deb build/debcheck
          component=$(find build/debcheck -name metasequoiaime.xml | head -1)
          engine=$(sed -n 's|.*<exec>\([^ <]*\).*|\1|p' "$component")
          echo "component exec: $engine"
          if [[ ! -x "build/debcheck$engine" ]]; then
            echo "The packaged IBus component points at $engine, which the package does not ship." >&2
            exit 1
          fi
      - name: Check patches
        run: git diff --check
