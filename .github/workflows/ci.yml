name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu IBus
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config libibus-1.0-dev libboost-dev libfmt-dev libspdlog-dev libsqlite3-dev python3 python3-gi gir1.2-ibus-1.0 ibus dbus-x11 iso-codes
      - name: Build dictionary
        run: python3 scripts/build_dictionary.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 20 -E '^ibus_smoke$'
      - name: IBus D-Bus smoke
        run: ctest --test-dir build --output-on-failure --timeout 20 -R '^ibus_smoke$'
      - name: Current-user install smoke
        shell: bash
        run: |
          install_root=$(mktemp -d)
          trap 'rm -rf "$install_root"' EXIT
          HOME="$install_root/home" ./scripts/install.sh
          test -x "$install_root/home/.local/libexec/metasequoia-ime-ibus"
          test -f "$install_root/home/.local/share/ibus/component/metasequoiaime.xml"
          test -f "$install_root/home/.local/share/metasequoiaime/msime.db"
          test -f "$install_root/home/.local/share/metasequoiaime/helpcodes/helpcode.txt"
          test -f "$install_root/home/.local/share/metasequoiaime/helpcodes/zrm_helpcode_big_unique.txt"
          test -f "$install_root/home/.local/share/metasequoiaime/helpcodes/shouyou2_0_helpcode.txt"
          test -f "$install_root/home/.local/share/metasequoiaime/helpcodes/shouyouplus_helpcode.txt"
          test -f "$install_root/home/.local/share/metasequoiaime/helpcodes/xiaohe_helpcode.txt"
          grep -F "<exec>$install_root/home/.local/libexec/metasequoia-ime-ibus --ibus</exec>" \
            "$install_root/home/.local/share/ibus/component/metasequoiaime.xml"
      - name: Check patches
        run: git diff --check
