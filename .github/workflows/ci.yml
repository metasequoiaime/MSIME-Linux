name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

  merge_group:

permissions:
  contents: read

# Keep one run per ref per event and drop the superseded ones.
#
# The event has to be part of the key. The release branch carries two runs at the same instant: a
# pull_request run GitHub creates but never executes, because the repository's own Actions token
# opened that pull request, and the workflow_dispatch run the release workflow asks for so the
# branch gets a real check. Keyed on ref alone the first evicted the second, and the release pull
# request ended up with no checks at all.
#
# This does not reintroduce the double build the original key was written for: push is limited to
# main, so a branch in this repository only ever produces the pull_request run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  # The inputs the packages are built from are checked once, independently of the build matrix.
  product:
    uses: ./.github/workflows/product-ci.yml

  linux:
    # Both architectures are covered because the published packages target both,
    # and GitHub's arm64 runners are free for public repositories, so the second
    # job runs in parallel and costs no extra wall-clock time.
    #
    # 26.04 is covered in a container because every defect found by testing there
    # by hand came from distribution versions rather than architecture: ibus
    # 1.5.34 dropping per-context engine activation, GCC 15 warnings, and gvfs
    # mounting inside XDG_RUNTIME_DIR. A runner image alone cannot see any of it.
    name: Ubuntu ${{ matrix.release }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "24.04"
            arch: amd64
            runner: ubuntu-24.04
            image: ""
          - release: "24.04"
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ""
          - release: "26.04"
            arch: amd64
            runner: ubuntu-24.04
            image: "ubuntu:26.04"
          - release: "26.04"
            arch: arm64
            runner: ubuntu-24.04-arm
            image: "ubuntu:26.04"
    defaults:
      run:
        # Container jobs otherwise default to sh, which has no shopt or arrays.
        shell: bash
    env:
      # Container jobs run as root and have no sudo; runner jobs are not root.
      SUDO: ${{ matrix.image == '' && 'sudo' || '' }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The checked-out tree is only usable by the later steps if git is present,
      # and the bare image has neither git nor the tools the scripts assume.
      - name: Prepare the container
        if: ${{ matrix.image != '' }}
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates curl git python3 python3-venv sudo
          # The workspace is owned by the runner user, not by root inside the
          # container, and git refuses to read a repository it considers foreign.
          git config --global --add safe.directory '*'
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The runner jobs exercise the archive bootstrap below, which is what
          # that script is for. Repeating it in every job multiplied the
          # unauthenticated GitHub API calls from one runner address until they
          # started coming back 403, so the container jobs take the submodules
          # over git instead.
          submodules: ${{ matrix.image != '' && 'recursive' || '' }}
      # Cheap and runs before the build so a formatting slip fails in seconds
      # rather than after the full compile. Formatting is architecture
      # independent, so only one job needs to check it.
      - name: Check formatting
        if: ${{ matrix.arch == 'amd64' && matrix.release == '24.04' }}
        run: scripts/format.sh --check
      - name: Bootstrap and test dependencies
        if: ${{ matrix.image == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tests/CiDependenciesTests.sh "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: $SUDO apt-get update && $SUDO apt-get install --no-install-recommends -y build-essential cmake file pkg-config libibus-1.0-dev libboost-dev libboost-json-dev libcurl4-openssl-dev nlohmann-json3-dev libfmt-dev libspdlog-dev libsqlite3-dev libsecret-1-dev libgtk-3-dev tesseract-ocr tesseract-ocr-chi-sim gnome-keyring python3 python3-gi python3-pypinyin gir1.2-ibus-1.0 gir1.2-gtk-3.0 ibus ibus-gtk3 dbus-x11 iso-codes xvfb xauth xdotool
      - name: Build dictionary
        run: python3 scripts/fetch_dictionary.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --no-tests=error --test-dir build --output-on-failure --timeout 20 -E '^ibus_smoke$'
      - name: IBus D-Bus smoke
        run: ctest --no-tests=error --test-dir build --output-on-failure --timeout 20 -R '^ibus_smoke$'
      - name: GTK input and focus smoke at normal and doubled scale
        run: |
          python3 tests/GtkInputSmoke.py build --scale 1
          python3 tests/GtkInputSmoke.py build --scale 2
      - name: Current-user install smoke
        shell: bash
        run: tests/InstallSmoke.sh build
      # Every packaging defect this project has had installed cleanly and then
      # did nothing: a component naming a path the package did not ship, two of
      # three dictionaries missing, dictionaries written where the engine never
      # looks. Inspecting the archive catches the ones already known; running
      # what is inside it catches the next one.
      - name: Packaged install smoke
        shell: bash
        run: tests/PackagedInstallSmoke.sh build
      # Release assets from both architectures land in the same place, so a name
      # that omits the architecture silently overwrites the other build. This is
      # cheap here and catches it before a release rather than during one.
      # The install smoke above reconfigures this build directory with its own
      # throwaway prefix, so packaging has to reconfigure with the prefix the
      # packages install into before it can check anything meaningful.
      - name: Verify packaged names and component path
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr
          rm -rf build/nametest build/debcheck
          cpack --config build/CPackConfig.cmake -G "TGZ;DEB" -B build/nametest
          machine=$(uname -m)
          shopt -s nullglob
          archives=(build/nametest/*.tar.gz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one archive, found: ${archives[*]}" >&2
            exit 1
          fi
          echo "archive: ${archives[0]}"
          if [[ "${archives[0]}" != *"$machine"* ]]; then
            echo "Archive name does not carry the architecture $machine: ${archives[0]}" >&2
            exit 1
          fi
          # The IBus component's exec path must name a file the package ships,
          # or the engine registers but can never be activated.
          mkdir -p build/debcheck
          dpkg-deb -x build/nametest/*.deb build/debcheck
          component=$(find build/debcheck -name metasequoiaime.xml | head -1)
          engine=$(sed -n 's|.*<exec>\([^ <]*\).*|\1|p' "$component")
          echo "component exec: $engine"
          if [[ ! -x "build/debcheck$engine" ]]; then
            echo "The packaged IBus component points at $engine, which the package does not ship." >&2
            exit 1
          fi
      - name: Check patches
        run: git diff --check

  # The shared engine runs this same pair of sanitizers on every change (MSIME-Engine's
  # "Linux ASan and UBSan" job), but the frontend layer had none -- and that is the layer that parses
  # untrusted input, talks D-Bus and manages IBus lifetimes. The most recent audit-driven fix in the
  # Windows frontend was a batch of races and null derefs of exactly this kind, none of which the
  # existing Debug build would have caught.
  #
  # One architecture and one release is enough: memory errors are not architecture specific, and this
  # is about catching them at all rather than catching them everywhere.
  sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential cmake file pkg-config libibus-1.0-dev libboost-dev libboost-json-dev libcurl4-openssl-dev nlohmann-json3-dev libfmt-dev libspdlog-dev libsqlite3-dev libsecret-1-dev libgtk-3-dev tesseract-ocr tesseract-ocr-chi-sim gnome-keyring python3 python3-gi python3-pypinyin gir1.2-ibus-1.0 ibus dbus-x11 iso-codes
      - name: Build dictionary
        run: python3 scripts/fetch_dictionary.py
      - name: Configure instrumented debug build
        run: >-
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitizers --parallel
      # ibus_smoke and the *Smoke.sh suites launch the engine under ibus-daemon and other processes
      # that are not themselves instrumented, so ASan's interceptors report on code this job is not
      # testing. The in-process unit tests are what the sanitizers are here for.
      - name: Test memory safety and undefined behavior
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --no-tests=error --test-dir build-sanitizers --output-on-failure --timeout 120 -E '^ibus_smoke$'
