name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Ubuntu IBus
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Bootstrap and test dependencies
        run: tests/CiDependenciesTests.sh "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential cmake pkg-config libibus-1.0-dev libboost-dev libboost-json-dev libcurl4-openssl-dev libfmt-dev libspdlog-dev libsqlite3-dev libsecret-1-dev libgtk-3-dev gnome-keyring python3 python3-gi python3-pypinyin gir1.2-ibus-1.0 ibus dbus-x11 iso-codes
      - name: Build dictionary
        run: python3 scripts/build_dictionary.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 20 -E '^ibus_smoke$'
      - name: IBus D-Bus smoke
        run: ctest --test-dir build --output-on-failure --timeout 20 -R '^ibus_smoke$'
      - name: Current-user install smoke
        shell: bash
        run: tests/InstallSmoke.sh build
      - name: Check patches
        run: git diff --check
