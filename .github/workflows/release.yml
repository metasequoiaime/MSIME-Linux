name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    permissions:
      # actions: write lets the dispatch step below start ci.yml on the release branch, which is
      # the only trigger GITHUB_TOKEN is allowed to fire.
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      should_publish: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created == 'true' }}
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.release.outputs.tag_name }}
      target_sha: ${{ github.event_name == 'workflow_dispatch' && steps.requested_release.outputs.target_sha || steps.release.outputs.sha }}
    steps:
      # release-please opens a version PR from conventional commits. Merging that
      # PR is what tags the release and creates the draft the publish job builds.
      - name: Prepare release
        if: ${{ github.event_name == 'push' }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Without this the release pull request carries no check at all, so it gets merged blind
      # and required_status_checks cannot be turned on for this repository.
      - name: Dispatch CI for the release branch
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/dispatch_release_ci.sh

      # A dispatched run publishes an existing draft rather than creating one, so
      # everything it will build has to be pinned and checked up front.
      - name: Validate requested draft release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: requested_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          release_json=$(gh release view "$TAG_NAME" --json isDraft,targetCommitish)
          if [[ "$(jq -er .isDraft <<< "$release_json")" != true ]]; then
            echo "Release $TAG_NAME is not an unpublished draft." >&2
            exit 1
          fi
          target_sha=$(jq -er .targetCommitish <<< "$release_json")
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Draft release target must be an immutable full commit SHA." >&2
            exit 1
          fi
          version=$(gh api "repos/$GH_REPO/contents/version.txt?ref=$target_sha" --jq .content | base64 --decode)
          if [[ "$TAG_NAME" != "v${version//[[:space:]]/}" ]]; then
            echo "Release $TAG_NAME does not match version.txt ($version)." >&2
            exit 1
          fi
          printf 'target_sha=%s\n' "$target_sha" >> "$GITHUB_OUTPUT"

  package:
    # Apple Silicon Linux VMs, Raspberry Pi and Ampere hosts cannot install an
    # amd64 package, so both architectures are built. GitHub's arm64 runners are
    # free for public repositories and run in parallel with the amd64 job.
    name: Build packages (${{ matrix.arch }})
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit provenance
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Release commit must be part of main history." >&2
            exit 1
          fi
      - name: Resolve version
        id: version
        env:
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          version=${TAG_NAME#v}
          if [[ "$(tr -d '[:space:]' < version.txt)" != "$version" ]]; then
            echo "version.txt does not match $TAG_NAME." >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      # Git transport is unavailable for the pinned forks, so the same archive
      # bootstrap CI uses materializes them here.
      - name: Materialize pinned dependencies
        run: scripts/bootstrap_ci_dependencies.sh "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential cmake file pkg-config libibus-1.0-dev libboost-dev libboost-json-dev libcurl4-openssl-dev libfmt-dev libspdlog-dev libsqlite3-dev libsecret-1-dev libgtk-3-dev tesseract-ocr tesseract-ocr-chi-sim gnome-keyring python3 python3-gi python3-pypinyin gir1.2-ibus-1.0 ibus dbus-x11 iso-codes rpm
      - name: Build dictionary
        run: python3 scripts/fetch_dictionary.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMETASEQUOIA_IME_PACKAGE_VERSION=${{ steps.version.outputs.value }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60
      - name: Current-user install smoke
        shell: bash
        run: tests/InstallSmoke.sh build
      # The install smoke reconfigures this build directory with its own throwaway
      # prefix, which rewrites the generated IBus component. Reconfigure with the
      # prefix the packages actually install into, so the component's exec path
      # matches where the binary lands rather than /usr/local or a temp path.
      - name: Configure for packaging
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMETASEQUOIA_IME_PACKAGE_VERSION=${{ steps.version.outputs.value }}
      - name: Package
        run: cpack --config build/CPackConfig.cmake -G "TGZ;DEB;RPM" -B build/packages
      - name: Verify package versions
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          shopt -s nullglob
          packages=(build/packages/*.tar.gz build/packages/*.deb build/packages/*.rpm)
          if [[ ${#packages[@]} -ne 3 ]]; then
            echo "Expected one TGZ, one DEB and one RPM, found: ${packages[*]}" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if [[ "$package" != *"$VERSION"* ]]; then
              echo "Package does not carry version $VERSION: $package" >&2
              exit 1
            fi
          done
          dpkg-deb --field build/packages/*.deb Package Version Maintainer
          # The component's exec path must name a file the package actually
          # ships, or the engine registers but can never be activated.
          rm -rf build/debcheck && mkdir -p build/debcheck
          dpkg-deb -x build/packages/*.deb build/debcheck
          component=$(find build/debcheck -name metasequoiaime.xml | head -1)
          engine=$(sed -n 's|.*<exec>\([^ <]*\).*|\1|p' "$component")
          echo "component exec: $engine"
          if [[ ! -x "build/debcheck$engine" ]]; then
            echo "The packaged IBus component points at $engine, which the package does not ship." >&2
            exit 1
          fi
      # The draft could have been retargeted while the build ran, so confirm it
      # still points at the commit that produced these packages.
      - name: Revalidate draft release target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          release_json=$(gh release view "$TAG_NAME" --repo "$GH_REPO" --json isDraft,targetCommitish)
          test "$(jq -er .isDraft <<< "$release_json")" = true
          test "$(jq -er .targetCommitish <<< "$release_json")" = "$TARGET_SHA"
      - name: Upload architecture assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" --repo "$GH_REPO" --clobber \
            build/packages/*.tar.gz build/packages/*.deb build/packages/*.rpm

  publish:
    # Promotion happens once, after every architecture has uploaded, so a
    # published release never carries only half of its assets.
    name: Publish release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Confirm both architectures are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          assets=$(gh release view "$TAG_NAME" --repo "$GH_REPO" --json assets --jq '.assets[].name')
          printf '%s\n' "$assets"
          for expected in amd64.deb arm64.deb x86_64.rpm aarch64.rpm linux-x86_64.tar.gz linux-aarch64.tar.gz; do
            if ! grep -q -- "$expected" <<< "$assets"; then
              echo "Release is missing an asset matching $expected." >&2
              exit 1
            fi
          done
      - name: Promote the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          release_json=$(gh release view "$TAG_NAME" --repo "$GH_REPO" --json isDraft,targetCommitish)
          test "$(jq -er .isDraft <<< "$release_json")" = true
          test "$(jq -er .targetCommitish <<< "$release_json")" = "$TARGET_SHA"
          gh release edit "$TAG_NAME" --repo "$GH_REPO" --draft=false --latest
